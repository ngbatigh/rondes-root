<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Relevés de Compteurs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
      <button class="close-btn" id="closeBtn">&times;</button>
      <nav>
        <ul class="sidebar-menu">
          <li><a href="#" data-action="recap">📋 Recap ronde</a></li>
          <li>
            <a href="#" data-action="operateurs">👥 Gestion des opérateurs</a>
          </li>
          <li>
            <a href="#" data-action="compteurs">🔢 Gestion des compteurs</a>
          </li>
          <li><a href="#" data-action="rondes">🔄 Gestion des Rondes</a></li>
          <li><a href="#" data-action="dashboard">📈 Tableau de bord</a></li>
          <li><a href="#" data-action="tableur">📑 Tableur</a></li>
        </ul>
      </nav>
    </div>

    <div class="container">
      <header>
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1>📊 Relevés de Compteurs</h1>
      </header>

      <main>
        <!-- Écran d'accueil Gestion des Rondes -->
        <div id="gestionRondesMenu" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromRondesMenu">←</button>
            <h2>🔄 Gestion des Rondes</h2>
          </div>
          <div class="menu-cards">
            <button class="menu-card" id="goToAjouterRonde">
              <span class="menu-card-icon">➕</span>
              <span class="menu-card-text">Ajouter type de ronde</span>
            </button>
            <button class="menu-card" id="goToSupprimerRonde">
              <span class="menu-card-icon">🗑️</span>
              <span class="menu-card-text">Supprimer type de ronde</span>
            </button>
          </div>
        </div>

        <!-- Panneau Ajouter type de ronde -->
        <div id="ajouterRondePanel" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromAjouter">←</button>
            <h2>➕ Ajouter type de ronde</h2>
          </div>

          <div class="form-group">
            <label for="nouvelleRondeNom">Nom de la ronde :</label>
            <input
              type="text"
              id="nouvelleRondeNom"
              placeholder="Ex: Relevé hebdomadaire"
            />
          </div>

          <div class="form-group">
            <label for="nouvelleRondeDelai">Délai (minutes) :</label>
            <input
              type="number"
              id="nouvelleRondeDelai"
              placeholder="Ex: 10080"
            />
          </div>

          <div class="form-group">
            <label for="nouvelleRondeDescription">Description :</label>
            <input
              type="text"
              id="nouvelleRondeDescription"
              placeholder="Ex: relevé du lundi matin"
            />
          </div>

          <div class="btn-row">
            <button class="btn-secondary" id="annulerAjouter">
              ❌ Annuler
            </button>
            <button id="ajouterRondeBtn">✅ Ajouter</button>
          </div>
        </div>

        <!-- Panneau Supprimer type de ronde -->
        <div id="supprimerRondePanel" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromSupprimer">←</button>
            <h2>🗑️ Supprimer type de ronde</h2>
          </div>

          <div id="rondesCheckList"></div>

          <button id="supprimerRondesBtn">🗑️ Supprimer la sélection</button>
        </div>

        <form id="releveForm">
          <div class="form-group">
            <label for="operateur">Opérateur :</label>
            <select id="operateur" name="operateur" required>
              <option value="">Sélectionner un opérateur</option>
              <option value="Koffi">Koffi</option>
              <option value="Gbati">Gbati</option>
              <option value="Abalo">Abalo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="id_ronde">Type de ronde :</label>
            <select id="id_ronde" name="id_ronde" required>
              <option value="">Sélectionner une ronde</option>
            </select>
          </div>

          <div class="form-group">
            <label for="compteur">Compteur :</label>
            <select id="compteur" name="compteur" required>
              <option value="">Sélectionner un compteur</option>
              <option value="eau">Eau (m³)</option>
              <option value="electricite">Électricité (kWh)</option>
              <option value="ddo">DDO (m³)</option>
              <option value="produit">Produit (hl)</option>
              <option value="temp">Temp (min)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="valeurActuelle">Valeur actuelle :</label>
            <input
              type="number"
              id="valeurActuelle"
              name="valeurActuelle"
              step="any"
              required
            />
          </div>

          <button type="submit" id="submitBtn">Valider la saisie</button>
        </form>

        <div id="message" class="message"></div>
      </main>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
