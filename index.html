<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Relevés de Compteurs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
      <button class="close-btn" id="closeBtn">&times;</button>
      <nav>
        <ul class="sidebar-menu">
          <li><a href="#" data-action="recap">📋 Recap ronde</a></li>
          <li>
            <a href="#" data-action="operateurs">👥 Gestion des opérateurs</a>
          </li>
          <li>
            <a href="#" data-action="compteurs">🔢 Gestion des compteurs</a>
          </li>
          <li><a href="#" data-action="rondes">🔄 Gestion des Rondes</a></li>
          <li><a href="#" data-action="dashboard">📈 Tableau de bord</a></li>
          <li><a href="#" data-action="tableur">📑 Tableur</a></li>
        </ul>
      </nav>
    </div>

    <div class="container">
      <header>
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1>📊 Relevés de Compteurs</h1>
      </header>

      <main>
        <!-- Écran d'accueil Gestion des opérateurs -->
        <div id="gestionOperateursMenu" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromOperateursMenu">←</button>
            <h2>👥 Gestion des opérateurs</h2>
          </div>
          <div class="menu-cards">
            <button class="menu-card" id="goToAjouterOperateur">
              <span class="menu-card-icon">➕</span>
              <span class="menu-card-text">Ajouter opérateur</span>
            </button>
            <button class="menu-card" id="goToModifierOperateur">
              <span class="menu-card-icon">✏️</span>
              <span class="menu-card-text">Modifier opérateur</span>
            </button>
            <button class="menu-card" id="goToSupprimerOperateur">
              <span class="menu-card-icon">🗑️</span>
              <span class="menu-card-text">Supprimer opérateur</span>
            </button>
          </div>
        </div>

        <!-- Panneau Ajouter opérateur -->
        <div id="ajouterOperateurPanel" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromAjouterOperateur">←</button>
            <h2>➕ Ajouter opérateur</h2>
          </div>

          <div class="form-group">
            <label for="nouvelOperateurId">Matricule (ID) :</label>
            <input type="text" id="nouvelOperateurId" placeholder="Ex: 966" />
          </div>

          <div class="form-group">
            <label for="nouvelOperateurNom">Nom :</label>
            <input
              type="text"
              id="nouvelOperateurNom"
              placeholder="Ex: NADJOMBE"
            />
          </div>

          <div class="form-group">
            <label for="nouvelOperateurPrenom">Prénom :</label>
            <input
              type="text"
              id="nouvelOperateurPrenom"
              placeholder="Ex: Gbati"
            />
          </div>

          <div class="form-group">
            <label for="nouvelOperateurFonction">Fonction :</label>
            <input
              type="text"
              id="nouvelOperateurFonction"
              placeholder="Ex: Chef Service"
            />
          </div>

          <div class="form-group">
            <label for="nouvelOperateurUser">Nom d'utilisateur :</label>
            <input
              type="text"
              id="nouvelOperateurUser"
              placeholder="Ex: gbati"
            />
          </div>

          <div class="form-group">
            <label for="nouvelOperateurMdp">Mot de passe :</label>
            <input
              type="text"
              id="nouvelOperateurMdp"
              placeholder="Ex: admin"
            />
          </div>

          <div class="btn-row">
            <button class="btn-secondary" id="annulerAjouterOperateur">
              ❌ Annuler
            </button>
            <button id="ajouterOperateurBtn">✅ Ajouter</button>
          </div>
        </div>

        <!-- Panneau Modifier opérateur -->
        <div id="modifierOperateurPanel" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromModifierOperateur">←</button>
            <h2>✏️ Modifier opérateur</h2>
          </div>

          <div class="form-group">
            <label for="selectOperateurModif"
              >Sélectionner un opérateur :</label
            >
            <select id="selectOperateurModif">
              <option value="">Sélectionner...</option>
            </select>
          </div>

          <div id="formModifierOperateur" style="display: none">
            <div class="form-group">
              <label for="modifOperateurId">Matricule (ID) :</label>
              <input type="text" id="modifOperateurId" />
              <input type="hidden" id="ancienOperateurId" />
            </div>

            <div class="form-group">
              <label for="modifOperateurNom">Nom :</label>
              <input type="text" id="modifOperateurNom" />
            </div>

            <div class="form-group">
              <label for="modifOperateurPrenom">Prénom :</label>
              <input type="text" id="modifOperateurPrenom" />
            </div>

            <div class="form-group">
              <label for="modifOperateurFonction">Fonction :</label>
              <input type="text" id="modifOperateurFonction" />
            </div>

            <div class="form-group">
              <label for="modifOperateurUser">Nom d'utilisateur :</label>
              <input type="text" id="modifOperateurUser" />
            </div>

            <div class="form-group">
              <label for="modifOperateurMdp">Mot de passe :</label>
              <input type="text" id="modifOperateurMdp" />
            </div>

            <div class="btn-row">
              <button class="btn-secondary" id="annulerModifierOperateur">
                ❌ Annuler
              </button>
              <button id="modifierOperateurBtn">💾 Enregistrer</button>
            </div>
          </div>
        </div>

        <!-- Panneau Supprimer opérateur -->
        <div id="supprimerOperateurPanel" class="panel" style="display: none">
          <div class="panel-header">
            <button class="back-btn" id="backFromSupprimerOperateur">←</button>
            <h2>🗑️ Supprimer opérateur</h2>
          </div>

          <div id="operateursCheckList"></div>

          <button id="supprimerOperateursBtn">🗑️ Supprimer la sélection</button>
        </div>

        <form id="releveForm">
          <div class="form-group">
            <label for="operateur">Opérateur :</label>
            <select id="operateur" name="operateur" required>
              <option value="">Sélectionner un opérateur</option>
            </select>
          </div>

          <div class="form-group">
            <label for="id_ronde">Type de ronde :</label>
            <select id="id_ronde" name="id_ronde" required>
              <option value="">Sélectionner une ronde</option>
            </select>
          </div>

          <div class="form-group">
            <label for="compteur">Compteur :</label>
            <select id="compteur" name="compteur" required>
              <option value="">Sélectionner un compteur</option>
              <option value="eau">Eau (m³)</option>
              <option value="electricite">Électricité (kWh)</option>
              <option value="ddo">DDO (m³)</option>
              <option value="produit">Produit (hl)</option>
              <option value="temp">Temp (min)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="valeurActuelle">Valeur actuelle :</label>
            <input
              type="number"
              id="valeurActuelle"
              name="valeurActuelle"
              step="any"
              required
            />
          </div>

          <button type="submit" id="submitBtn">Valider la saisie</button>
        </form>

        <div id="message" class="message"></div>
      </main>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
